site_name: wxl的记录
site_description: 技术笔记与学习记录
site_url: https://illionj.github.io/
repo_url: https://github.com/illionj/illionj.github.io
repo_name: illionj/illionj.github.io

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: zh
  favicon: favicon.ico
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - toc.integrate
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    scheme: default
    primary: indigo
    accent: teal

nav:
  - 笔记:
      - index.md
  - 关于: about.md
  - 分类: category/index.md
  - tags: tags.md

plugins:
  - search:
      enabled: true
      lang: null
      separator: null
      pipeline: null
      fields: {}
      jieba_dict: null
      jieba_dict_user: null
  - blog:
      enabled: true
      blog_dir: .
      blog_toc: false
      post_dir: "{blog}/posts"
      post_date_format: long
      post_url_date_format: yyyy/MM/dd
      post_url_format: "{categories}/{slug}"
      post_url_max_categories: 1
      post_slugify_separator: "-"
      post_excerpt: required
      post_excerpt_max_authors: 1
      post_excerpt_max_categories: 5
      post_excerpt_separator: "<!-- more -->"
      post_readtime: true
      post_readtime_words_per_minute: 265
      archive: true
      archive_name: blog.archive
      archive_date_format: yyyy
      archive_url_date_format: yyyy
      archive_url_format: archive/{date}
      categories: true
      categories_name: blog.categories
      categories_url_format: category/{slug}
      categories_slugify_separator: "-"
      categories_sort_reverse: false
      categories_allowed: []
      authors: true
      authors_file: "{blog}/.authors.yml"
      authors_profiles: false
      authors_profiles_name: blog.authors
      authors_profiles_url_format: author/{slug}
      pagination: true
      pagination_per_page: 10
      pagination_url_format: page/{page}
      pagination_format: "~2~"
      pagination_if_single_page: false
      pagination_keep_content: false
      draft: true
      draft_on_serve: true
      draft_if_future_date: false
  - tags:
      enabled: true
      tags: true
      tags_slugify_separator: "-"
      tags_slugify_format: "tag:{slug}"
      tags_hierarchy: false
      tags_hierarchy_separator: "/"
      tags_sort_reverse: false
      tags_name_property: tags
      tags_name_variable: tags
      tags_allowed: []
      listings: true
      listings_map: {}
      listings_sort_reverse: false
      listings_tags_sort_reverse: false
      listings_directive: material/tags
      listings_layout: default
      listings_toc: true
      shadow: false
      shadow_on_serve: true
      shadow_tags: []
      shadow_tags_prefix: ""
      shadow_tags_suffix: ""
      export: true
      export_file: tags.json
      export_only: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css
