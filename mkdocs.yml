site_name: wxl的记录
site_description: 技术笔记与学习记录
site_url: https://illionj.github.io/
repo_url: https://github.com/illionj/illionj.github.io
repo_name: illionj/illionj.github.io

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: zh
  favicon: favicon.ico
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - toc.integrate
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    scheme: default
    primary: indigo
    accent: teal

nav:
  - 笔记:
      - index.md
  - 关于: about.md
  - 分类: category/index.md
  - tags: tags.md

plugins:
  - search
  - blog:
      blog_dir: .
      post_url_format: "{categories}/{slug}"
      post_excerpt: required
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css
